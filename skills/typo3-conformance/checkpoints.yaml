# Checkpoints for typo3-conformance skill
# Validates TYPO3 extension structure, configuration, and coding standards

# RELOCATED FROM php-modernization-skill (v1.16.0 refocus):
#   PM-26 -> TC-180 (PSR-3 logging compliance)
#   PM-27 -> TC-181 (PSR-14 event dispatch safety)
#   PM-28 -> TC-182 (factory pattern + baseline)
#   PM-33 -> TC-183 (GeneralUtility::makeInstance -> DI)

version: 1
skill_id: typo3-conformance

# Only run for TYPO3 extensions (SKILL.md: "Scope: extensions only"). Without
# this gate /assess ran all checks against a Python repository and reported
# 39 failures that were not about that repository.
preconditions:
  - type: json_path
    target: composer.json
    pattern: '.type == "typo3-cms-extension"'

mechanical:
  # === ext_emconf.php CHECKS ===
  - id: TC-01
    type: file_exists
    target: ext_emconf.php
    severity: error
    desc: "ext_emconf.php must exist for TYPO3 extension registration"

  - id: TC-02
    type: contains
    target: ext_emconf.php
    pattern: "'title'"
    severity: error
    desc: "ext_emconf.php must define 'title' field"

  - id: TC-03
    type: contains
    target: ext_emconf.php
    pattern: "'description'"
    severity: error
    desc: "ext_emconf.php must define 'description' field"

  - id: TC-04
    type: contains
    target: ext_emconf.php
    pattern: "'version'"
    severity: error
    desc: "ext_emconf.php must define 'version' field"

  - id: TC-05
    type: contains
    target: ext_emconf.php
    pattern: "'constraints'"
    severity: error
    desc: "ext_emconf.php must define 'constraints' with TYPO3 core dependency"

  - id: TC-06
    type: regex
    target: ext_emconf.php
    pattern: "['\"]state['\"][[:space:]]*=>[[:space:]]*['\"](stable|beta|alpha|experimental|test|obsolete|excludeFromUpdates)['\"]"
    severity: warning
    desc: "ext_emconf.php should define valid 'state' field"

  # === composer.json CHECKS ===
  - id: TC-10
    type: file_exists
    target: composer.json
    severity: error
    desc: "composer.json must exist for Composer-based installation"

  - id: TC-11
    type: contains
    target: composer.json
    pattern: '"typo3-cms-extension"'
    severity: error
    desc: "composer.json type must be 'typo3-cms-extension'"

  - id: TC-12
    type: json_path
    target: composer.json
    pattern: '.require["typo3/cms-core"]'
    severity: error
    desc: "composer.json must require typo3/cms-core"

  - id: TC-13
    type: json_path
    target: composer.json
    pattern: '.autoload["psr-4"]'
    severity: error
    desc: "composer.json must define PSR-4 autoloading"

  - id: TC-14
    type: regex
    target: composer.json
    pattern: '"[A-Z][a-zA-Z0-9_]*\\\\[A-Z][a-zA-Z0-9_]*\\\\": "Classes/?"'
    severity: error
    desc: "PSR-4 autoload must map vendor namespace to Classes/ directory"

  - id: TC-15
    type: json_path
    target: composer.json
    pattern: '.extra["typo3/cms"]["extension-key"]'
    severity: warning
    desc: "composer.json should define extension-key in extra.typo3/cms"

  - id: TC-16
    type: command
    pattern: |
      composer validate --strict 2>&1 || true
    severity: warning
    desc: "composer.json should pass strict validation"

  # === DIRECTORY STRUCTURE CHECKS ===
  - id: TC-20
    type: file_exists
    target: Classes/
    severity: error
    desc: "Classes/ directory must exist for PHP classes"

  - id: TC-21
    type: file_exists
    target: Configuration/
    severity: warning
    desc: "Configuration/ directory should exist for TCA, TypoScript, etc."

  - id: TC-22
    type: file_exists
    target: Resources/
    severity: warning
    desc: "Resources/ directory should exist for templates, assets, translations"

  - id: TC-23
    type: file_exists
    target: Resources/Private/
    severity: warning
    desc: "Resources/Private/ should exist for templates and partials"

  - id: TC-24
    type: file_exists
    target: Resources/Public/
    severity: info
    desc: "Resources/Public/ should exist for CSS, JS, and images"

  # === DEPENDENCY INJECTION CHECKS ===
  - id: TC-30
    type: file_exists
    target: Configuration/Services.yaml
    severity: warning
    desc: "Services.yaml should exist for dependency injection configuration"

  - id: TC-31
    type: contains
    target: Configuration/Services.yaml
    pattern: "autowire: true"
    severity: info
    desc: "Services.yaml should enable autowiring"

  - id: TC-32
    type: contains
    target: Configuration/Services.yaml
    pattern: "autoconfigure: true"
    severity: info
    desc: "Services.yaml should enable autoconfiguration"

  # === TCA CONFIGURATION CHECKS ===
  - id: TC-35
    type: file_exists
    target: Configuration/TCA/
    severity: info
    desc: "Configuration/TCA/ should exist if extension defines database tables"

  - id: TC-185
    type: regex_not
    target: "ext_tables.sql"
    pattern: "KEY\\s+\\w+\\s*\\([^)]*\\w\\(\\d"
    severity: error
    desc: "ext_tables.sql KEY definitions must not use column prefix lengths (e.g. fieldname(12)) — TYPO3 Database Schema Analyzer rejects this syntax and the index is silently not created"
    tags: [database, schema, ext_tables, index]

  # === DEPRECATED API PATTERNS ===
  - id: TC-40
    type: not_contains
    target: Classes/**/*.php
    pattern: "$GLOBALS['TYPO3_DB']"
    severity: error
    desc: "Must not use deprecated TYPO3_DB global (removed in TYPO3 v10)"

  - id: TC-41
    type: not_contains
    target: Classes/**/*.php
    pattern: "GeneralUtility::makeInstance(ObjectManager"
    severity: warning
    desc: "Should not instantiate ObjectManager directly; use dependency injection"

  - id: TC-42
    type: not_contains
    target: Classes/**/*.php
    pattern: "ObjectManager::get("
    severity: warning
    desc: "Should not use ObjectManager::get(); use dependency injection"

  - id: TC-43
    type: not_contains
    target: Classes/**/*.php
    pattern: "GeneralUtility::_GP("
    severity: warning
    desc: "Should not use deprecated _GP(); use request object instead"

  - id: TC-44
    type: not_contains
    target: Classes/**/*.php
    pattern: "GeneralUtility::_GET("
    severity: warning
    desc: "Should not use deprecated _GET(); use request object instead"

  - id: TC-45
    type: not_contains
    target: Classes/**/*.php
    pattern: "GeneralUtility::_POST("
    severity: warning
    desc: "Should not use deprecated _POST(); use request object instead"

  - id: TC-46
    type: not_contains
    target: Classes/**/*.php
    pattern: "$GLOBALS['TSFE']->fe_user"
    severity: warning
    desc: "Should not access fe_user via TSFE global; use Context API"

  - id: TC-47
    type: not_contains
    target: Classes/**/*.php
    pattern: "extRelPath("
    severity: error
    desc: "Must not use deprecated extRelPath() (removed in TYPO3 v10)"

  - id: TC-48
    type: not_contains
    target: Classes/**/*.php
    pattern: "BackendUtility::getModuleUrl("
    severity: error
    desc: "Must not use deprecated getModuleUrl(); use UriBuilder"

  # === EXTENSION REGISTRATION ===
  - id: TC-50
    type: file_exists
    target: ext_localconf.php
    severity: info
    desc: "ext_localconf.php should exist for frontend/backend registration"

  # ext_tables.php is OPTIONAL in TYPO3 v13+ — backend modules / AJAX routes
  # are registered via Configuration/Backend/{Modules,AjaxRoutes,Routes}.php.
  # Accept any of the registration entry-points (or pure-service extensions
  # with no backend surface at all).
  - id: TC-51
    type: file_exists
    target: "{ext_tables.php,Configuration/Backend/Modules.php,Configuration/Backend/AjaxRoutes.php,Configuration/Backend/Routes.php}"
    severity: info
    desc: "Backend modules / AJAX routes registered via either ext_tables.php (legacy) or Configuration/Backend/*.php (TYPO3 v13+ recommended). Pure-service extensions may have neither."

  # === STRICT TYPES DECLARATION ===
  - id: TC-07
    type: regex_not
    target: ext_emconf.php
    pattern: '^[[:space:]]*(<\?php[[:space:]]+)?declare[[:space:]]*\([[:space:]]*strict_types'
    severity: error
    desc: "ext_emconf.php MUST NOT contain declare(strict_types=1) - TER upload will fail"

  - id: TC-08
    type: regex
    target: ext_emconf.php
    pattern: '\$EM_CONF\[\$_EXTKEY\]'
    severity: error
    desc: "ext_emconf.php must use $EM_CONF[$_EXTKEY], not a hardcoded extension key"

  - id: TC-09
    type: contains
    target: ext_emconf.php
    pattern: "'category'"
    severity: warning
    desc: "ext_emconf.php should define valid 'category' field"

  # === CODING STANDARDS: STRICT TYPES ===
  - id: TC-17
    type: regex
    target: Classes/**/*.php
    pattern: 'declare\(strict_types=1\)'
    severity: warning
    desc: "All PHP files in Classes/ should declare strict_types=1"

  # === COMPOSER.JSON ADDITIONAL CHECKS ===
  - id: TC-18
    type: json_path
    target: composer.json
    pattern: '.require["php"]'
    severity: error
    desc: "composer.json must declare PHP version constraint"

  - id: TC-19
    type: json_path
    target: composer.json
    pattern: '.license'
    severity: warning
    desc: "composer.json should declare license (GPL-2.0-or-later recommended)"

  - id: TC-25
    type: json_path
    target: composer.json
    pattern: '.description'
    severity: warning
    desc: "composer.json should have a meaningful description"

  - id: TC-26
    type: regex
    target: composer.json
    pattern: '"name"\s*:\s*"[a-z0-9-]+/[a-z0-9-]+"'
    severity: error
    desc: "composer.json name must follow vendor/package-name format"

  - id: TC-27
    type: not_contains
    target: composer.json
    pattern: '"typo3-ter/'
    severity: warning
    desc: "composer.json should not contain deprecated typo3-ter replace entries"

  # === ADDITIONAL PROHIBITED PATTERNS ===
  - id: TC-36
    type: not_contains
    target: Classes/**/*.php
    pattern: "$GLOBALS['TYPO3_CONF_VARS']"
    severity: warning
    desc: "Should not access TYPO3_CONF_VARS via $GLOBALS; use ExtensionConfiguration"

  - id: TC-37
    type: not_contains
    target: Classes/**/*.php
    pattern: "$GLOBALS['BE_USER']"
    severity: warning
    desc: "Should not access BE_USER via $GLOBALS; use Context API"

  - id: TC-38
    type: not_contains
    target: Classes/**/*.php
    pattern: "$GLOBALS['LANG']"
    severity: warning
    desc: "Should not access LANG via $GLOBALS; use LanguageServiceFactory"

  - id: TC-39
    type: not_contains
    target: Classes/**/*.php
    pattern: "$GLOBALS['TCA']"
    severity: warning
    desc: "Should not access TCA via $GLOBALS; use TcaSchemaFactory (v14+) or inject TCA via DI"

  # === BACKEND MODULE MODERNIZATION (v13+) ===
  - id: TC-52
    type: command
    pattern: "! grep -rEP '<script(?![^>]*\\\\bsrc=)(?![^>]*type=\"application/(json|ld\\\\+json)\")[^>]*' Resources/Private/Templates/ 2>/dev/null"
    severity: warning
    desc: "Templates should not contain inline <script> tags; use ES6 modules"

  - id: TC-53
    type: file_exists
    target: Configuration/Icons.php
    severity: info
    scope: backend
    desc: "Configuration/Icons.php should exist for icon registration (v12+)"

  # Configuration/Sets/ is REQUIRED for sitepackage extensions in TYPO3 v13+
  # (Site Sets) but is N/A for service/provider/library extensions. Detect
  # sitepackage by the presence of typical sitepackage markers (page
  # templates, page.tsconfig, Yaml/Site/). If none of those exist → skip;
  # otherwise require Configuration/Sets/.
  - id: TC-54
    type: command
    pattern: |
      if [ -e Configuration/page.tsconfig ] || [ -d Configuration/Yaml/Site ] || [ -d Resources/Private/Templates/Page ] || [ -d Resources/Private/Layouts/Page ]; then [ -d Configuration/Sets ]; else exit 0; fi
    severity: info
    desc: "Configuration/Sets/ required for sitepackage extensions in TYPO3 v13+ (detected via page templates / page.tsconfig / Yaml/Site/). Skipped for service/provider extensions."

  # === CI TOOLING CENTRALIZATION ===
  - id: TC-90
    type: json_path
    target: composer.json
    pattern: '.["require-dev"]["netresearch/typo3-ci-workflows"]'
    severity: warning
    desc: "require-dev should use netresearch/typo3-ci-workflows for centralized CI tooling"

  - id: TC-91
    type: not_contains
    target: composer.json
    pattern: '"friendsofphp/php-cs-fixer"'
    severity: info
    desc: "require-dev should not individually list php-cs-fixer (provided by typo3-ci-workflows)"

  - id: TC-92
    type: file_exists
    target: Build/Scripts/runTests.sh
    severity: warning
    desc: "Build/Scripts/runTests.sh should exist for local test execution"

  - id: TC-93
    type: regex
    target: "{phpstan.neon,Build/phpstan.neon,Build/phpstan/phpstan.neon,phpstan.neon.dist}"
    pattern: 'typo3-ci-workflows'
    severity: info
    desc: "PHPStan config should include shared config from typo3-ci-workflows"

  # === TCA v13 PATTERN CHECKS ===
  # `eval => 'trim'` is NOT deprecated: DataHandler::checkValue_input_Eval()
  # still handles it at v14.3.7, and the core's own migration example for
  # Deprecation #97035 keeps `'eval' => 'trim'` as the correct form. What is
  # deprecated (since v12.0, auto-migrated with an E_USER_DEPRECATED) is
  # `required` inside `eval`; the standalone `'required' => true` replaces it.
  - id: TC-100
    type: regex_not
    target: Configuration/TCA/**/*.php
    pattern: "['\"]eval['\"]\\s*=>\\s*['\"][^'\"]*\\brequired\\b"
    severity: warning
    desc: "TCA eval must not contain 'required' (deprecated since v12.0, #97035); use 'required' => true. eval=trim stays valid"
    provenance: upstream
    source: https://github.com/TYPO3/typo3/blob/v14.3.7/typo3/sysext/core/Documentation/Changelog/12.0/Deprecation-97035-RequiredOptionInEvalKeyword.rst
    verified: 2026-09-27

  - id: TC-101
    type: regex_not
    target: Configuration/TCA/**/*.php
    pattern: "l10n_parent.*type.*group"
    severity: error
    desc: "TCA translation l10n_parent must not use type=group; use type=select with renderType=selectSingle"

  - id: TC-102
    type: regex_not
    target: Configuration/TCA/**/*.php
    pattern: "(prependAtCopy|hideAtCopy)"
    severity: warning
    desc: "TCA should not contain prependAtCopy or hideAtCopy; removed in TYPO3 v13"

  # `find -exec` is refused by the runner's dangerous-pattern screen ('exec'
  # followed by whitespace), so this never executed and reported a failure on
  # every project. Piping find's output into a consumer is the shape TC-120 and
  # TC-157 already use — into `php -r` there, into xargs here.
  - id: TC-103
    type: command
    pattern: |
      [ -d Configuration/TCA/ ] || exit 0
      found=$(find Configuration/TCA/ -name '*.php' -not -path '*/.Build/*' -not -path '*/vendor/*' -print0 2>/dev/null | xargs -0 -r grep -lP 'foreign_table' 2>/dev/null)
      [ -z "$found" ] && exit 0
      missing=$(echo "$found" | while IFS= read -r f; do
        grep -LP 'default' "$f" 2>/dev/null
      done)
      if [ -n "$missing" ]; then
        echo "TCA files with foreign_table but no default value: $missing"
        exit 1
      fi
      exit 0
    severity: warning
    desc: "TCA select fields with foreign_table should define a default value to avoid NULL issues"

  # === DI / ARCHITECTURE CHECKS ===
  - id: TC-110
    type: command
    pattern: |
      set -o pipefail; ! grep -rn 'GeneralUtility::makeInstance' Classes/ 2>/dev/null | grep -v 'Classes/Task/' | grep -v 'Classes/Scheduler/' | grep -v 'Typo3QuerySettings' | grep -v 'ConnectionPool' | grep -v 'QueryBuilder' | grep -v 'FlashMessage' | grep -q .
    severity: warning
    desc: "Classes/ should use dependency injection instead of GeneralUtility::makeInstance for services (excludes Scheduler tasks, ConnectionPool, QueryBuilder, FlashMessage)"

  - id: TC-111
    type: regex_not
    target: Classes/**/*.php
    pattern: "PersistenceManager[^I]"
    severity: warning
    desc: "Should use PersistenceManagerInterface in type hints, not concrete PersistenceManager class"

  - id: TC-112
    type: not_contains
    target: Classes/**/*.php
    pattern: "GeneralUtility::makeInstance(ExtensionConfiguration"
    severity: warning
    desc: "Should inject ExtensionConfiguration via constructor DI instead of using GeneralUtility::makeInstance"

  # === SECURITY PATTERN CHECKS ===
  # Prohibited process-execution functions. Token-level, because a regex
  # reads prose: `system (` inside a docblock ("...content in the system
  # (default + custom tables)") matched the previous pattern and reported
  # a call that does not exist. token_get_all() classifies comments as
  # T_COMMENT/T_DOC_COMMENT and literals as T_CONSTANT_ENCAPSED_STRING, so
  # only a T_STRING/T_NAME_FULLY_QUALIFIED name directly before `(` — and
  # not after ->, ?->, ::, function or new — counts as a call.
  #
  # The file list comes from find, which excludes the ignored dependency
  # trees (.Build/, vendor/, node_modules/). `find -exec` is unusable here:
  # the runner's dangerous-pattern filter matches `exec` + whitespace.
  - id: TC-120
    type: command
    pattern: "find Classes/ -type f -name '*.php' -not -path '*/.Build/*' -not -path '*/vendor/*' -not -path '*/node_modules/*' 2>/dev/null | php -r 'exit( (fn($files) => count(array_filter( $files, fn($f) => (fn($n) => count( array_filter( array_filter( array_filter( array_filter( array_keys($n), fn($i) => in_array($n[$i][0], [T_STRING, T_NAME_FULLY_QUALIFIED], true) ), fn($i) => in_array(ltrim(strtolower($n[$i][1]), chr(92)), [\"shell_exec\", \"exec\", \"system\", \"passthru\"], true) ), fn($i) => ($n[$i + 1] ?? \"\") === \"(\" ), fn($i) => !in_array(($n[$i - 1] ?? [0])[0], [T_OBJECT_OPERATOR, T_NULLSAFE_OBJECT_OPERATOR, T_DOUBLE_COLON, T_FUNCTION, T_NEW], true) ) ) > 0)( array_values(array_filter( token_get_all(file_get_contents($f)), fn($x) => !in_array($x[0], [T_WHITESPACE, T_COMMENT, T_DOC_COMMENT], true) )) ) )) > 0 ? 1 : 0)( array_filter(array_map(\"trim\", explode(chr(10), file_get_contents(\"php://stdin\"))), \"is_file\") ) ) ?>'"
    severity: error
    desc: "Must not use shell_exec, exec, system, or passthru; use CommandUtility or Symfony Process"

  - id: TC-121
    type: not_contains
    target: Classes/**/*.php
    pattern: "md5(uniqid"
    severity: error
    desc: "Must not use md5(uniqid()); use random_bytes() or GeneralUtility::makeInstance(Random::class) — md5(uniqid()) is cryptographically weak and a security vulnerability"

  - id: TC-122
    type: regex_not
    target: Classes/**/*.php
    pattern: "\\bserialize\\s*\\("
    severity: error
    desc: "Must not use serialize(); prefer json_encode/json_decode — serialize() enables object injection attacks"

  - id: TC-122b
    type: regex_not
    target: Classes/**/*.php
    pattern: "\\bunserialize\\s*\\("
    severity: error
    desc: "Must not use unserialize(); use json_decode instead — unserialize() without allowed_classes is an object injection vulnerability"

  # Exit status comes from the match itself. The previous pattern ended in
  # `grep ... | head -5 && echo ... || true`, where head exits 0 on empty
  # input, so the verdict never depended on the tree.
  - id: TC-123
    type: command
    pattern: "! grep -rn '{[a-zA-Z]\\+}\\|{[a-zA-Z]\\+\\.' Resources/Private/Templates/ 2>/dev/null | grep -v 'f:format.raw\\|f:format.html\\|f:uri\\|f:link\\|f:translate\\|f:image\\|f:if\\|f:for\\|f:render\\|f:section\\|f:layout\\|f:comment\\|f:count\\|f:format.htmlspecialchars\\|f:security\\|f:be\\.' | grep -q ."
    severity: warning
    desc: "Fluid templates should use f:format.htmlspecialchars on dynamic output to prevent XSS"

  # === TEMPLATE / BOOTSTRAP 5 CHECKS ===
  - id: TC-130
    type: regex_not
    target: Resources/Private/**/*.html
    pattern: "(form-inline|form-row|btn-default|form-group)"
    severity: warning
    desc: "Templates should not use Bootstrap 4 classes (form-inline, form-row, btn-default); migrate to Bootstrap 5"

  # === CI CONFIGURATION CHECKS ===
  - id: TC-140
    type: command
    pattern: |
      # Only fail if push trigger exists WITHOUT branch restrictions
      grep -A2 '^on:' .github/workflows/ci.yml 2>/dev/null | grep -q 'push:' || exit 0
      grep -A5 'push:' .github/workflows/ci.yml 2>/dev/null | grep -q 'branches' && exit 0
      echo 'ci.yml has unrestricted push trigger — should restrict to specific branches'
      exit 1
    severity: warning
    desc: "CI workflow push trigger should be restricted to specific branches, not bare push:"

  - id: TC-141
    type: json_path
    target: composer.json
    pattern: '.["require-dev"]["netresearch/typo3-ci-workflows"]'
    severity: info
    desc: "require-dev should reference netresearch/typo3-ci-workflows for centralized CI tooling"

  # === PHPSTAN BASELINE CHECKS ===
  - id: TC-150
    type: command
    pattern: |
      if [ -f phpstan-baseline.neon ]; then count=$(grep -c 'message:' phpstan-baseline.neon 2>/dev/null || echo 0); if [ "$count" -gt 10 ]; then echo "WARN: PHPStan baseline has $count suppressed errors (should trend toward 0)" && exit 1; fi; elif [ -f Build/phpstan-baseline.neon ]; then count=$(grep -c 'message:' Build/phpstan-baseline.neon 2>/dev/null || echo 0); if [ "$count" -gt 10 ]; then echo "WARN: PHPStan baseline has $count suppressed errors (should trend toward 0)" && exit 1; fi; fi; exit 0
    severity: warning
    desc: "PHPStan baseline should trend toward zero suppressed errors (>10 indicates significant technical debt)"

  # === TCA SEARCHFIELDS AND SORTBY CHECKS ===
  # NUL-delimited throughout. A whitespace-separated hand-off splits
  # `Configuration/TCA/tx my table.php` into three non-existent paths, every
  # grep in the chain fails, and the pipeline reports the tree as clean — a
  # violating file passes silently. `-print0`/`xargs -0` for the first hop,
  # `grep -lZ` for the second.
  #
  # TYPO3 v14 removed ctrl.searchFields (Breaking #106972): suitable fields are
  # searchable by default and a per-column `searchable` option replaces it. The
  # option is therefore demanded only while the extension still supports a core
  # older than v14 (typo3/cms-core constraint naming a 1-13 major); a
  # v14-only extension passes without it.
  - id: TC-151
    type: script
    command: |
      core=$(jq -r '.require["typo3/cms-core"] // ""' composer.json 2>/dev/null)
      if [ -n "$core" ] && ! printf '%s' "$core" | grep -qE '(^|[^0-9.])([1-9]|1[0-3])([^0-9]|$)'; then
        exit 0
      fi
      missing=$(find Configuration/TCA/ -name '*.php' -not -path '*/.Build/*' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0 2>/dev/null | xargs -0 -r grep -lZE '(^|[^a-zA-Z_])ctrl[^a-zA-Z_]' 2>/dev/null | xargs -0 -r grep -L 'searchFields' 2>/dev/null)
      test -z "$missing"
    severity: error
    desc: "TCA ctrl arrays must define searchFields while TYPO3 < 14 is supported (removed in v14, #106972; v14-only extensions pass)"
    provenance: upstream
    source: https://github.com/TYPO3/typo3/blob/v14.3.7/typo3/sysext/core/Documentation/Changelog/14.0/Breaking-106972-TCAControlOptionSearchFieldsRemoved.rst
    verified: 2026-09-27

  - id: TC-152
    type: command
    pattern: "! find Configuration/TCA/ -name '*.php' -not -path '*/.Build/*' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0 2>/dev/null | xargs -0 -r grep -lZE '(^|[^a-zA-Z_])sortby[^a-zA-Z_]' 2>/dev/null | xargs -0 -r grep -L 'default_sortby' 2>/dev/null | grep -q ."
    severity: warning
    desc: "TCA tables with sortby should also define default_sortby for consistent ordering"

  # === DI INTERFACE ALIAS CHECKS ===
  # Only interfaces DECLARED under Classes/ and named as a CONSTRUCTOR
  # parameter type count. The previous grep collected every token ending in
  # `Interface` (use lines, implements, catch blocks, framework callback
  # signatures such as execute(InputInterface $input), ::class constants) and
  # tested the short name as a substring of Services.yaml, so foreign
  # interfaces aliased by their own package and interfaces consumed only as a
  # !tagged_iterator were reported. An interface counts as aliased when
  # Services.yaml has it as a service id directly under `services:` (quoted or
  # not; a key under `_instanceof:`, `bind:` or `arguments:` is no alias), or when a class under
  # Classes/ implementing it carries #[AsAlias] (bare, on a class with that
  # single interface, or naming it, positionally or as `id:`). Symfony also aliases an interface with
  # exactly one implementation in the loaded resource on its own
  # (FileLoader::registerAliasesForSinglyImplementedInterfaces); the explicit
  # alias demanded here is the skill's rule from php-architecture.md
  # "Interface Aliases", and a hard requirement once a second implementation
  # exists. Short names resolve through every clause of a `use` statement,
  # including `use A\B, C\D;` and the group form `use A\{B, C as D};`.
  - id: TC-153
    type: command
    pattern: |
      [ -d Classes ] || exit 0
      [ -f Configuration/Services.yaml ] || exit 0
      find Classes -type f -name '*.php' -not -path '*/vendor/*' -not -path '*/node_modules/*' -not -path '*/.Build/*' 2>/dev/null | php -r '
      $files = array_filter(array_map("trim", explode("\n", stream_get_contents(STDIN))), "is_file");
      $yaml = file_get_contents("Configuration/Services.yaml");
      // Service ids directly under `services:` (quoted or not). A key under
      // `_instanceof:`, `bind:`, `arguments:` or any other nested map is not
      // an alias and is not collected.
      $keys = []; $in = false; $ind = -1;
      foreach (preg_split("/\R/", $yaml) as $l) {
          if (preg_match("~^[^\s#]~", $l)) { $in = (bool) preg_match("~^services:\s*(#.*)?$~", $l); $ind = -1; continue; }
          if (!$in || preg_match("~^\s*(#|$)~", $l)) continue;
          $i = strlen($l) - strlen(ltrim($l, " \t"));
          if ($ind < 0) $ind = $i;
          if ($i !== $ind) continue;
          if (!preg_match("~^\s*(\x27[^\x27]*\x27|\"(?:[^\"\\\\]|\\\\.)*\"|[^\s:#\x27\"][^:]*?)\s*:(\s|$)~", $l, $m)) continue;
          $k = $m[1];
          if ($k[0] === "\x27") $k = substr($k, 1, -1);
          elseif ($k[0] === "\"") $k = stripcslashes(substr($k, 1, -1));
          $keys[ltrim($k, "\\")] = true;
      }
      $own = [];          // FQCN => true for interfaces declared under Classes/
      $injected = [];     // FQCN => "file" of the first constructor naming it
      $implementors = []; // FQCN of interface => list of [class, hasAsAlias, asAliasTarget]
      foreach ($files as $f) {
          $t = array_values(array_filter(token_get_all(file_get_contents($f)), fn($x) => !(is_array($x) && in_array($x[0], [T_WHITESPACE, T_COMMENT, T_DOC_COMMENT], true))));
          $ns = ""; $uses = []; $n = count($t); $asAlias = [];
          $resolve = function (string $name) use (&$ns, &$uses): string {
              if ($name[0] === "\\") return ltrim($name, "\\");
              $first = explode("\\", $name)[0];
              if (isset($uses[$first])) return $uses[$first] . substr($name, strlen($first));
              return ltrim($ns . "\\" . $name, "\\");
          };
          $nameAt = function (int $i) use ($t): ?string {
              return is_array($t[$i] ?? null) && in_array($t[$i][0], [T_STRING, T_NAME_QUALIFIED, T_NAME_FULLY_QUALIFIED], true) ? $t[$i][1] : null;
          };
          $depth = 0;
          for ($i = 0; $i < $n; $i++) {
              $tok = $t[$i]; $id = is_array($tok) ? $tok[0] : $tok;
              if ($id === "{" || $id === T_CURLY_OPEN || $id === T_DOLLAR_OPEN_CURLY_BRACES) { $depth++; continue; }
              if ($id === "}") { $depth--; continue; }
              if ($id === T_NAMESPACE && ($nm = $nameAt($i + 1)) !== null) { $ns = $nm; continue; }
              // Every clause of `use A\B, C\D as E;` and every member of the
              // group form `use A\{B, C\D as E};`; `function` and `const`
              // members are skipped.
              if ($id === T_USE && $depth === 0 && $nameAt($i + 1) !== null) {
                  $prefix = ""; $grp = false;
                  for ($j = $i + 1; $j < $n && $t[$j] !== ";"; $j++) {
                      if ($t[$j] === "{") { $grp = true; continue; }
                      if ($t[$j] === "}") { $grp = false; $prefix = ""; continue; }
                      if (is_array($t[$j]) && in_array($t[$j][0], [T_FUNCTION, T_CONST], true)) { $j++; continue; }
                      if (($nm = $nameAt($j)) === null) continue;
                      if (!$grp && is_array($t[$j + 1] ?? null) && $t[$j + 1][0] === T_NS_SEPARATOR && ($t[$j + 2] ?? null) === "{") { $prefix = ltrim($nm, "\\") . "\\"; $j++; continue; }
                      $alias = substr(strrchr("\\" . $nm, "\\"), 1);
                      if (is_array($t[$j + 1] ?? null) && $t[$j + 1][0] === T_AS) { $alias = $t[$j + 2][1]; $j += 2; }
                      $uses[$alias] = ltrim($prefix . $nm, "\\");
                  }
                  $i = $j;
                  continue;
              }
              if ($id === T_ATTRIBUTE) {
                  $nm = $nameAt($i + 1);
                  if ($nm !== null && str_ends_with($nm, "AsAlias")) {
                      $target = "";
                      $o = $i + 3; // #[AsAlias(Foo::class)] or the named form #[AsAlias(id: Foo::class)]
                      if (is_array($t[$o] ?? null) && $t[$o][0] === T_STRING && $t[$o][1] === "id" && ($t[$o + 1] ?? null) === ":") $o += 2;
                      if (($t[$i + 2] ?? null) === "(" && ($a = $nameAt($o)) !== null && is_array($t[$o + 1] ?? null) && $t[$o + 1][0] === T_DOUBLE_COLON) $target = $resolve($a);
                      $asAlias[] = $target; // "" is a bare #[AsAlias]; the attribute is repeatable
                  }
                  continue;
              }
              if ($id === T_INTERFACE && ($nm = $nameAt($i + 1)) !== null) { $own[$resolve($nm)] = true; continue; }
              if ($id === T_CLASS && ($nm = $nameAt($i + 1)) !== null && !(is_array($t[$i - 1] ?? null) && $t[$i - 1][0] === T_DOUBLE_COLON)) {
                  $cls = $resolve($nm); $ifs = [];
                  for ($j = $i + 2; $j < $n && $t[$j] !== "{"; $j++) {
                      if (is_array($t[$j]) && $t[$j][0] === T_IMPLEMENTS) {
                          for ($k = $j + 1; $k < $n && $t[$k] !== "{"; $k++) if (($x = $nameAt($k)) !== null) $ifs[] = $resolve($x);
                          break;
                      }
                  }
                  foreach ($ifs as $if) $implementors[$if][] = [$cls, in_array($if, $asAlias, true) || (in_array("", $asAlias, true) && count($ifs) === 1)];
                  $asAlias = [];
                  continue;
              }
              if ($id === T_FUNCTION && ($t[$i + 1][1] ?? "") === "__construct" && ($t[$i + 2] ?? null) === "(") {
                  $level = 0;
                  for ($j = $i + 2; $j < $n; $j++) {
                      if ($t[$j] === "(") $level++;
                      elseif ($t[$j] === ")") { if (--$level === 0) break; }
                      elseif ($level === 1 && ($x = $nameAt($j)) !== null && !(is_array($t[$j + 1]) && $t[$j + 1][0] === T_DOUBLE_COLON)) {
                          $fq = $resolve($x);
                          $injected[$fq] ??= $f;
                      }
                  }
              }
          }
      }
      $missing = 0;
      foreach ($injected as $fq => $f) {
          if (!isset($own[$fq])) continue;
          if (isset($keys[$fq])) continue;
          $viaAttr = array_filter($implementors[$fq] ?? [], fn($c) => $c[1]);
          if ($viaAttr !== []) continue;
          echo "WARN: $fq is injected by a constructor ($f) but has no alias (Services.yaml key or #[AsAlias])\n";
          $missing = 1;
      }
      exit($missing);
      '
    severity: warning
    desc: "Interfaces declared in Classes/ and injected through a constructor should have an explicit alias (Services.yaml key or #[AsAlias])"

  # === CACHE DOUBLE-LOOKUP ANTI-PATTERN ===
  - id: TC-154
    type: command
    pattern: |
      [ -d Classes/ ] || exit 0; set -o pipefail; ! grep -rnP '->has\(' Classes/ 2>/dev/null | sed -E 's/^[^:]+:[0-9]+://' | grep -iq cache
    severity: warning
    desc: "Cache get should not be preceded by has() -- use get() directly and check for false (path-prefix stripped to avoid false-positives from Cache/ directory names)"

  # === REPOSITORY QUERY PROPERTY NAME CHECK ===
  # Test PHP source under Classes/Domain/Repository/ for snake_case names
  # passed to ->equals() / ->like() / ->contains(). Filenames are stripped
  # before the snake_case check (sed) so directory names like Cache_Foo/
  # don't generate false positives.
  - id: TC-155
    type: command
    pattern: |
      [ -d Classes/Domain/Repository/ ] || exit 0; set -o pipefail; ! grep -rn '\->equals(' Classes/Domain/Repository/ 2>/dev/null | sed -E 's/^[^:]+:[0-9]+://' | grep -Eq '_[a-z]'
    severity: error
    desc: "Extbase repository queries should use model property names (camelCase), not database column names (snake_case)"

  # === XLIFF COMPLETENESS CHECK ===
  # Only the extension's OWN static keys are checked. The previous grep
  # reported three classes of non-finding: `content.` / `menu.` fragments
  # left by Fluid `content.{label}` and PHP `'menu.' . $action`, which no
  # trans-unit can ever match; and TYPO3 core labels such as
  # LLL:EXT:core/.../locallang_core.xlf:labels.reload, which do not live in
  # this extension's Resources/Private/Language/ at all. The extension key
  # comes from composer.json extra.typo3/cms.extension-key, falling back to
  # ext_emconf.php; with no key resolvable the check cannot tell own from
  # foreign and skips.
  #
  # The ext_emconf fallback accepts a literal key only — `[^]$]*?` stops the
  # capture group reaching into `$EM_CONF[$_EXTKEY]`, the classic
  # ext_emconf.php spelling, where it captured the
  # VARIABLE NAME `_EXTKEY`. That key matches no LLL: reference, so every
  # missing trans-unit was reported as present. There is no reliable second
  # source for the key (the directory name is the branch name in a worktree
  # checkout, and a wrong key means false errors), so an unresolvable key
  # skips.
  #
  # The trans-unit lookup matches `id` as an XML attribute rather than the
  # literal `id="key"`: XML permits whitespace around `=` and single quotes,
  # and this check's severity is error, so a spelling difference must not
  # report an existing translation as missing.
  - id: TC-156
    type: command
    pattern: "php -r 'exit( (fn($read) => (fn($k) => $k === \"\" ? 0 : (fn($src, $hay) => (fn($m) => count(array_filter( array_keys($m[1]), fn($i) => $m[1][$i] === $k ? (str_ends_with($m[2][$i], \".\") ? false : (str_contains($m[2][$i], \"{\") ? false : preg_match(\"~[[:space:]]id[[:space:]]*=[[:space:]]*[\" . chr(34) . chr(39) . \"]\" . preg_quote($m[2][$i], \"~\") . \"[\" . chr(34) . chr(39) . \"]~\", $hay) === 0)) : false )) > 0 ? 1 : 0)( (fn($s) => preg_match_all(\"~LLL:EXT:([a-zA-Z0-9_]+)/Resources/Private/Language/[^:]+:([a-zA-Z0-9_.{}]+)~\", $s, $mm) ? $mm : [1 => [], 2 => []])($src) ) )( $read([\"Configuration\", \"Classes\", \"Resources/Private/Templates\"]), $read([\"Resources/Private/Language\"]) ) )( (fn($a) => $a !== \"\" ? $a : (fn($t) => preg_match(\"~EM_CONF[[][^]$]*?([a-zA-Z0-9_]+)~\", $t, $me) ? $me[1] : \"\")(is_file(\"ext_emconf.php\") ? file_get_contents(\"ext_emconf.php\") : \"\") )( (fn($c) => is_string($c[\"extra\"][\"typo3/cms\"][\"extension-key\"] ?? null) ? $c[\"extra\"][\"typo3/cms\"][\"extension-key\"] : \"\")(is_file(\"composer.json\") ? (json_decode(file_get_contents(\"composer.json\"), true) ?? []) : []) ) ) )( fn($dirs) => implode(\" \", array_map( fn($d) => is_dir($d) ? implode(\" \", array_map(\"file_get_contents\", array_filter(array_map(\"strval\", iterator_to_array(new RecursiveIteratorIterator(new RecursiveDirectoryIterator($d, RecursiveDirectoryIterator::SKIP_DOTS)), false)), \"is_file\"))) : \"\", $dirs )) ) ) ?>'"
    severity: error
    desc: "All LLL: references to this extension must have a corresponding XLIFF trans-unit (dynamic keys and other extensions' labels excluded)"

  # === DEPRECATED CONSTANTS WITH ENUM REPLACEMENTS ===
  # A @deprecated docblock immediately followed by a `const` declaration,
  # while the same tree also declares an enum. Token-level: T_DOC_COMMENT
  # carrying @deprecated with T_CONST among the next significant tokens,
  # and T_ENUM anywhere. The file list comes from find, which excludes the
  # ignored dependency trees (.Build/, vendor/, node_modules/).
  - id: TC-157
    type: command
    pattern: "find Classes/ -type f -name '*.php' -not -path '*/.Build/*' -not -path '*/vendor/*' -not -path '*/node_modules/*' 2>/dev/null | php -r 'exit( (fn($c) => count(array_filter($c, fn($v) => $v[0])) > 0 ? (count(array_filter($c, fn($v) => $v[1])) > 0 ? 1 : 0) : 0)( array_map( fn($f) => (fn($n) => [ count(array_filter( array_keys($n), fn($i) => $n[$i][0] === T_DOC_COMMENT ? (str_contains($n[$i][1], \"@deprecated\") ? in_array(T_CONST, [($n[$i + 1] ?? [0])[0], ($n[$i + 2] ?? [0])[0], ($n[$i + 3] ?? [0])[0]], true) : false) : false )) > 0, count(array_filter($n, fn($x) => $x[0] === T_ENUM)) > 0, ])( array_values(array_filter( token_get_all(file_get_contents($f)), fn($x) => !in_array($x[0], [T_WHITESPACE, T_COMMENT], true) )) ), array_filter(array_map(\"trim\", explode(chr(10), file_get_contents(\"php://stdin\"))), \"is_file\") ) ) ) ?>'"
    severity: warning
    desc: "Deprecated string constants (in @deprecated docblock) should not coexist with enum replacements in active code paths"


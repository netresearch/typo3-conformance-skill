      if ! grep -q 'typo3-ci-workflows' composer.json 2>/dev/null; then exit 0; fi; for f in Build/phpstan.neon phpstan.neon; do if [ -f "$f" ] && grep -qP 'level:\s*(10|max)' "$f" 2>/dev/null; then exit 0; fi; done; echo 'WARN: PHPStan should use level 10 (max) for extensions using typo3-ci-workflows shared config' && exit 1
    severity: warning
    desc: "PHPStan should use level 10 (max) for extensions using typo3-ci-workflows shared config"
    tags: [phpstan, ci, static-analysis]


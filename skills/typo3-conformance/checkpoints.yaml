    type: regex_not
    target: "Resources/Private/**/*.html"
    pattern: '<script(?![^>]*\bsrc=)(?![^>]*type="application/(json|ld\+json)")[^>]*>'
    severity: error
    desc: "Inline <script> tags violate CSP. Move JavaScript to external files loaded via f:be.pageRenderer includeJsFiles or AssetCollector"

  # === CODECOV PATCH TARGET CHECK ===
  - id: TC-160
    type: command
    # The `| head -1 || echo auto` fallback could never fire — head exits 0 even on
    # empty input, so an unreadable or patch-less codecov.yml yielded an empty
    # target rather than "auto". Handled explicitly below instead.
    #
    # The raw sed output is not the target: `target: "100%"`, `target: 100` and
    # `target: 100% # only unit coverage` are all a 100% patch target and none
    # of them equals the string `100%`, so a literal comparison passed four of
    # the five spellings. Strip the trailing comment, then the quotes, spaces
    # and percent sign, then compare the number.
    pattern: |
      [ -f codecov.yml ] || exit 0
      target=$(sed -n '/patch:/,/target:/{ s/.*target:[[:space:]]*//p; }' codecov.yml 2>/dev/null | sed -n 1p)
      target=${target%%#*}
      target=$(printf '%s' "$target" | tr -d "[:space:]\"'%")
      if [ -z "$target" ]; then
        exit 0
      fi
      case "$target" in
        100|100.0|100.00)
          echo "WARN: codecov patch target is 100% — use 80% or auto when only unit test coverage is uploaded"
          exit 1
          ;;
      esac
      exit 0
    severity: warning
    desc: "codecov patch target should not be 100% — use 80% or auto when only unit test coverage is uploaded"
    tags: [ci, codecov, coverage]

  # === PHPSTAN LEVEL 10 CHECK ===
